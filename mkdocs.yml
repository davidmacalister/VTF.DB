site_name: Valve Assets Wiki
site_url: https://davidmacalister.github.io/Valve-Textures-Documentation/
theme:
  name: material
  logo: img/logo.png 
  font:
    text:  Roboto
    code:  JetBrains Mono

  features:
    - navigation.tabs # se tirar isso, as abas no topo somem e fica tudo na lteral.
    - navigation.path # exibe o caminho das coisas
    - navigation.indexes
    - navigation.sections
    - navigation.prune
    - content.action.edit
    - content.action.view
    
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
        
  favicon: img/favicon.png
  icon:
    repo: fontawesome/brands/git-alt

repo_url: https://github.com/davidmacalister/Valve-Textures-Documentation
repo_name: davidmacalister/Valve-Textures-Documentation
edit_uri: edit/main/docs/

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  
extra_css:
  - stylesheets/extra.css
  
plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: true     # Exibe a data de criação
      type: timeago                  # Formato dinâmico (ex: "há 2 dias"). Use 'date' ou 'datetime' para datas fixas
      locale: pt
      fallback_to_build_date: true