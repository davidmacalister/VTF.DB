name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main # Altere para 'master' caso a sua branch principal use esse nome

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Baixa o histórico completo do Git para o plugin de datas (git-revision-date-localized) funcionar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy with MkDocs
        run: |
          mkdocs gh-deploy --force